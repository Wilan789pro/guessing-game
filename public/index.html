<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0e" />
    <title>Agent Prism Mission</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="scanlines"></div>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar__left">
          <span class="badge badge--red">TOP SECRET</span>
          <span class="badge badge--muted">MISSION CHANNEL</span>
        </div>
        <div class="topbar__right">
          <button id="reset-test-mission" class="danger-button hidden" type="button">RESET TEST</button>
          <button id="sound-toggle" class="ghost-button" type="button" aria-label="Toggle sound">SOUND: ON</button>
        </div>
      </header>

      <main id="app" class="app" aria-live="polite"></main>
    </div>

    <audio id="audio-context" preload="none"></audio>
    <script type="module" src="./app.js"></script>
  </body>
</html>
